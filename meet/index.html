<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>待ち合わせ案内</title>
<script>
// 待ち合わせ案内は歩く画面（walk/）の「地図で見る」に入れた（利用者 2026-10-31「meet と walk を融合したい。シームレスに行き来できるように」）。
// 前のリンク（?st=・from=・to=・pr=）をそのまま歩く画面の地図へ渡す
(function () {
  var q = new URLSearchParams(location.search), o = new URLSearchParams();
  o.set('st', q.get('st') || 'ikebukuro');
  o.set('view', 'map');
  if (q.get('from')) o.set('mfrom', q.get('from'));
  if (q.get('to')) o.set('mto', q.get('to'));
  if (q.get('pr')) o.set('pr', q.get('pr'));
  location.replace('../walk/?' + o.toString());
})();
</script>
</head>
<body><p>待ち合わせ案内は「歩く」画面に移りました。<a href="../walk/?st=ikebukuro&view=map">こちら</a></p></body>
</html>
